name: Generate CIAN Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cian-feed-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate Legenda feeds
        env:
          CIAN_ID_MARUSINO: ${{ secrets.CIAN_ID_MARUSINO }}
          CIAN_ID_KORENEVO: ${{ secrets.CIAN_ID_KORENEVO }}
        run: python -m legenda.fetch_feed

      - name: Generate Dominanta feeds
        env:
          CIAN_ID_SVET: ${{ secrets.CIAN_ID_SVET }}
        run: python -m dominanta.fetch_dominanta

      - name: Generate Aeon feed
        env:
          CIAN_ID_AEON: ${{ secrets.CIAN_ID_AEON }}
        run: python -m aeon.fetch_aeon

      - name: Validate generated feeds
        run: python validate_feeds.py

      - name: Synchronize deprecated feed URLs
        run: python sync_legacy_feeds.py

      - name: Validate deprecated feed URLs
        run: python validate_feeds.py --include-legacy

      - name: Commit and push feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            cian_feed.xml \
            marusino_feed.xml \
            korenevo_feed.xml \
            nekrasovka_feed.xml \
            svet_feed.xml \
            dominanta_feed.xml \
            aeon_riverpark_feed.xml \
            legenda/marusino_feed.xml \
            legenda/korenevo_feed.xml \
            legenda/nekrasovka_feed.xml \
            legenda/svet_feed.xml \
            legenda/dominanta_feed.xml \
            dominanta/svet_feed.xml \
            dominanta/dominanta_feed.xml \
            aeon/aeon_riverpark_feed.xml
          git diff --staged --quiet || git commit -m "chore: update feeds [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
