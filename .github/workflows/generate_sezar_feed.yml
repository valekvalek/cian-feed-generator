name: Generate SEZAR CITY Feed

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate_sezar_feed.yml'
      - 'sezar/fetch_sezar.py'
      - 'feed_common.py'
      - 'requirements.txt'
      - 'validate_feeds.py'

permissions:
  contents: write

concurrency:
  group: cian-feed-generation
  cancel-in-progress: false

jobs:
  generate-sezar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate Sezar feed and PNG layouts
        env:
          CIAN_ID_SEZAR_CITY: ${{ secrets.CIAN_ID_SEZAR_CITY }}
        run: python -m sezar.fetch_sezar

      - name: Validate Sezar feed
        run: python validate_feeds.py --only-sezar

      - name: Commit and push Sezar feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sezar/sezar_city_feed.xml sezar/layouts
          git diff --staged --quiet || git commit -m "chore: update Sezar feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
