name: Generate Svet Feed

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate_svet_feed.yml'
      - 'dominanta/fetch_dominanta.py'
      - 'feed_common.py'
      - 'requirements.txt'
      - 'sync_legacy_feeds.py'
      - 'validate_feeds.py'

permissions:
  contents: write

concurrency:
  group: feed-svet
  cancel-in-progress: false

jobs:
  generate-svet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate Svet feed
        env:
          CIAN_ID_SVET: ${{ secrets.CIAN_ID_SVET }}
        run: python -m dominanta.fetch_dominanta
      - name: Synchronize public aliases
        run: >-
          python sync_legacy_feeds.py
          --source dominanta/svet_feed.xml
          --source dominanta/dominanta_feed.xml
      - name: Validate Svet feed
        run: python validate_feeds.py --only svet --include-legacy
      - name: Commit and push Svet feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dominanta/svet_feed.xml dominanta/dominanta_feed.xml svet_feed.xml dominanta_feed.xml legenda/svet_feed.xml legenda/dominanta_feed.xml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Svet feed [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
            done
            exit 1
          fi
